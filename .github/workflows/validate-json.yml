name: Validate JSON

# data/*.json 의 문법을 검사합니다.
# 쉼표 하나를 빼먹으면 그 목록이 사이트에서 통째로 사라지는데,
# 이 검사가 실패하면 GitHub이 이메일로 알려주므로 조용히 깨지는 일을 막습니다.

on:
  push:
    paths:
      - 'data/**.json'
  pull_request:
    paths:
      - 'data/**.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every JSON file in data/
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const dir = 'data';
          let failed = [];
          let checked = 0;

          for (const f of fs.readdirSync(dir)) {
            if (!f.endsWith('.json')) continue;
            const p = `${dir}/${f}`;
            checked++;
            try {
              JSON.parse(fs.readFileSync(p, 'utf8'));
              console.log(`OK    ${p}`);
            } catch (e) {
              console.log(`FAIL  ${p}`);
              console.log(`      ${e.message}`);
              failed.push(p);
            }
          }

          console.log(`\n${checked}개 파일 검사 완료.`);
          if (failed.length) {
            console.log(`\n문법 오류가 있는 파일: ${failed.join(', ')}`);
            console.log('쉼표(,)를 빼먹었거나 따옴표가 맞지 않는지 확인하세요.');
            console.log('마지막 항목 뒤에는 쉼표를 붙이지 않습니다.');
            process.exit(1);
          }
          SCRIPT

      - name: Check referenced images exist
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          // people.json 이 가리키는 사진 파일이 실제로 있는지 확인합니다.
          const missing = [];
          try {
            const d = JSON.parse(fs.readFileSync('data/people.json', 'utf8'));
            const check = (photo) => {
              if (!photo) return;
              const p = `images/people/${photo}`;
              if (!fs.existsSync(p)) missing.push(p);
            };
            if (d.pi) check(d.pi.photo);
            (d.current || []).forEach(p => check(p.photo));
          } catch (e) {
            console.log('people.json 확인을 건너뜁니다:', e.message);
          }
          if (missing.length) {
            console.log('사진 파일이 없습니다 (사이트에서 빈 칸으로 보입니다):');
            missing.forEach(m => console.log('  ' + m));
            process.exit(1);
          }
          console.log('참조된 사진 파일이 모두 존재합니다.');
          SCRIPT
