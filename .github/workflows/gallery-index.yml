name: Update gallery index

# images/gallery/ 에 사진이 추가·삭제되면 data/gallery.json 의 목록을 자동으로 갱신합니다.
# 덕분에 사진을 올리는 사람은 목록 파일을 손댈 필요가 없습니다.

on:
  push:
    paths:
      - 'images/gallery/**'
  workflow_dispatch:        # Actions 탭에서 손으로 실행할 수도 있습니다

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild data/gallery.json
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const DIR  = 'images/gallery';
          const JSON_PATH = 'data/gallery.json';
          const IMAGE_RE = /\.(jpe?g|png|webp|avif|gif)$/i;

          // 갤러리 폴더의 이미지 목록
          let files = [];
          if (fs.existsSync(DIR)) {
            files = fs.readdirSync(DIR)
              .filter(f => IMAGE_RE.test(f))
              .filter(f => !f.startsWith('.'));
          }

          // 파일명 안의 날짜를 읽어 최신순으로 놓습니다.
          //   "Visit to Durham 2026 July.jpg"  → 2026-07
          //   "2026-07-27-towing-tank-test.jpg" → 2026-07
          // 날짜가 없는 파일은 뒤로 갑니다.
          const MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6,
                           jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
          function dateKey(name) {
            const stem = name.replace(/\.[^.]+$/, '');
            // 권장 형식 — "(2026.07) Visit to Durham"
            const head = stem.match(/^\((\d{4})\.(\d{1,2})\)/);
            if (head) return +head[1] * 100 + +head[2];

            let y = 0, m = 0;
            // "2026 July" 형태 — 앞쪽의 "2026 Tokyo" 같은 오검출을 피하려고 마지막 유효값을 씁니다
            const re = /(\d{4})\s+([A-Za-z]{3,9})/g;
            let hit;
            while ((hit = re.exec(stem)) !== null) {
              const k = hit[2].slice(0, 3).toLowerCase();
              if (MONTHS[k]) { y = +hit[1]; m = MONTHS[k]; }
            }
            if (!y) {                                  // "2026-07-27" 형태
              const iso = stem.match(/(\d{4})-(\d{2})-(\d{2})/);
              if (iso) { y = +iso[1]; m = +iso[2]; }
            }
            return y * 100 + m;
          }
          // 날짜 최신순, 같은 날짜면 이름 오름차순 — (1 of 2) 가 (2 of 2) 보다 앞에 옵니다
          files.sort((a, b) => {
            const d = dateKey(b) - dateKey(a);
            return d !== 0 ? d : a.localeCompare(b, 'en');
          });

          // 기존 captions 는 보존합니다
          let data = { captions: {}, items: [] };
          if (fs.existsSync(JSON_PATH)) {
            try { data = JSON.parse(fs.readFileSync(JSON_PATH, 'utf8')); }
            catch (e) { console.log('기존 gallery.json 을 읽을 수 없어 새로 만듭니다:', e.message); }
          }
          data._comment = '이 파일은 GitHub Actions가 images/gallery/ 폴더를 읽어 자동으로 갱신합니다. 직접 편집하지 않아도 됩니다. 사진에 설명을 붙이려면 captions에 파일명을 키로 추가하세요.';
          data.captions = data.captions || {};
          data.items = files;

          fs.writeFileSync(JSON_PATH, JSON.stringify(data, null, 2) + '\n');
          console.log(`갤러리 사진 ${files.length}개를 인덱싱했습니다.`);
          SCRIPT

      # 이 워크플로가 만든 커밋은 다른 워크플로를 깨우지 못합니다(무한 반복 방지).
      # 그래서 gallery.html 갱신을 여기서 함께 해 한 번에 커밋합니다.
      - name: Write the gallery into gallery.html
        run: node scripts/build-html.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
          else
            git commit -m "chore: update gallery index [skip ci]"
            git push
          fi
